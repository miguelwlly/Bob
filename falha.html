<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bob Burguer</title><style>body{font-family:system-ui;background:#0d0d0d;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.c{max-width:520px;padding:28px;background:#1a1a1a;border-radius:18px;text-align:center}h1{color:#ffd100}p{color:#aaa}a{display:inline-block;margin-top:16px;padding:12px 20px;background:#ffd100;color:#111;border-radius:999px;text-decoration:none;font-weight:800}</style></head><body><main class="c"><h1>Pagamento não concluído</h1><p>O pagamento não foi aprovado. Você pode voltar e tentar novamente.</p><div id="s">Consultando pedido...</div><a href="/">Voltar</a></main><script>const id=new URLSearchParams(location.search).get('order');async function f(){if(!id)return;try{const r=await fetch('/api/orders/'+encodeURIComponent(id)+'/status'),d=await r.json();document.getElementById('s').textContent='Pedido #'+d.orderNumber+' — pagamento: '+d.paymentStatus}catch{document.getElementById('s').textContent='Não foi possível consultar agora.'}}f();setInterval(f,5000)</script></body></html>
